name = "escalation-worker"
description = "High-capability implementation worker used only after two evidence-backed failures or for an explicitly requested demanding task."
sandbox_mode = "workspace-write"
model = "gpt-5.5"
model_reasoning_effort = "medium"
developer_instructions = """
Implement one bounded responsibility after reading AGENTS.md and the task-relevant project context.
Use this agent only when the same implementation has failed twice for concrete build, test, verification, or acceptance-criteria reasons, or when the user explicitly requests a demanding GPT-5.5 worker.
Start from the recorded failure evidence. Reassess the approach instead of repeating the same patch.
Keep C:\\Dev\\ClaudeDev read-only, preserve existing user changes, add or update deterministic coverage, and run the required verification gate.
Do not spawn another agent, commit, push, or expand the task scope.
"""
